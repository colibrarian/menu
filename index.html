<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grill In — Ēdienkarte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════════════════ */
:root {
  --bg:            #F5F4F0;
  --surface:       #FFFFFF;
  --surface-warm:  #FAF9F6;
  --text:          #1A1A18;
  --text-2:        #6B6960;
  --text-3:        #9E9D97;
  --accent:        #C8410A;
  --accent-soft:   rgba(200,65,10,0.10);
  --accent-hover:  #A83508;
  --gold:          #B8882A;
  --border:        rgba(26,26,24,0.08);
  --border-med:    rgba(26,26,24,0.12);
  --shadow-sm:     0 1px 4px rgba(0,0,0,0.06);
  --shadow-md:     0 4px 20px rgba(0,0,0,0.09);
  --shadow-lg:     0 12px 40px rgba(0,0,0,0.14);
  --r:             14px;
  --r-sm:          10px;
  --font-body:     'DM Sans', sans-serif;
  --font-display:  'DM Serif Display', serif;
}

/* ═══════════════════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════════════════ */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════════════════════════════
   COOKIE BANNER
═══════════════════════════════════════════════════════ */
#cookieBanner {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 9999;
  background: var(--text);
  color: #fff;
  padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -8px 30px rgba(0,0,0,0.2);
  transform: translateY(0);
  transition: transform 0.4s cubic-bezier(0.32,0.72,0,1);
}
#cookieBanner.hidden { transform: translateY(110%); pointer-events: none; }

.cookie-title {
  font-family: var(--font-display);
  font-size: 18px;
  margin-bottom: 8px;
}
.cookie-text {
  font-size: 13px;
  color: rgba(255,255,255,0.72);
  line-height: 1.5;
  margin-bottom: 14px;
}
.cookie-text a { color: rgba(255,255,255,0.9); text-decoration: underline; cursor: pointer; }

.cookie-toggles {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 16px;
}
.cookie-toggle-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.cookie-toggle-row input[type="checkbox"] {
  width: 18px; height: 18px;
  accent-color: var(--accent);
  margin-top: 2px;
  flex-shrink: 0;
  cursor: pointer;
}
.cookie-toggle-label { font-size: 13px; line-height: 1.4; }
.cookie-toggle-label strong { font-weight: 600; color: #fff; display: block; }
.cookie-toggle-label span { color: rgba(255,255,255,0.6); }

.cookie-actions { display: flex; gap: 10px; }
.cookie-btn {
  flex: 1; height: 46px;
  border: none; border-radius: var(--r-sm);
  font-family: var(--font-body);
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.15s;
}
.cookie-btn:active { transform: scale(0.96); opacity: 0.85; }
.cookie-btn-primary { background: var(--accent); color: #fff; }
.cookie-btn-secondary {
  background: rgba(255,255,255,0.12);
  color: #fff;
}

/* ═══════════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════════ */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(245,244,240,0.88);
  backdrop-filter: saturate(180%) blur(24px);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
  border-bottom: 1px solid var(--border);
  padding: 10px 16px 0;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.header-brand {
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.header-brand-name {
  font-family: var(--font-display);
  font-size: 22px;
  letter-spacing: -0.3px;
  line-height: 1;
}
.header-brand-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  margin-bottom: 3px;
}

.header-right { display: flex; align-items: center; gap: 8px; }

/* Language switcher */
.lang-switch {
  display: flex;
  background: rgba(26,26,24,0.07);
  border-radius: 20px;
  padding: 2px;
  gap: 2px;
}
.lang-btn {
  font-size: 11px; font-weight: 600;
  font-family: var(--font-body);
  padding: 4px 8px;
  border-radius: 18px;
  border: none;
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
  transition: background 0.2s, color 0.2s;
}
.lang-btn.active { background: var(--text); color: #fff; }

/* Cart badge in header */
.header-cart-btn {
  background: var(--accent);
  color: white;
  font-size: 12px; font-weight: 700;
  font-family: var(--font-body);
  padding: 5px 10px;
  border-radius: 20px;
  cursor: pointer;
  display: none;
  align-items: center;
  gap: 5px;
  transition: transform 0.15s, opacity 0.15s;
  border: none;
}
.header-cart-btn:active { transform: scale(0.94); opacity: 0.85; }
.header-cart-count {
  background: rgba(255,255,255,0.25);
  border-radius: 10px;
  padding: 0 5px;
  font-size: 11px;
  min-width: 18px;
  text-align: center;
}

/* Table number chip */
.table-chip {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 12px; font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  margin-bottom: 8px;
}

/* Category pills */
.cat-scroll {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 0 0 10px;
  scroll-snap-type: x mandatory;
}
.cat-scroll::-webkit-scrollbar { display: none; }

.cat-pill {
  flex-shrink: 0;
  font-size: 13px; font-weight: 500;
  font-family: var(--font-body);
  padding: 6px 13px;
  border-radius: 20px;
  background: rgba(26,26,24,0.07);
  color: var(--text-2);
  border: none;
  cursor: pointer;
  scroll-snap-align: start;
  transition: background 0.2s, color 0.2s;
  white-space: nowrap;
}
.cat-pill.active { background: var(--text); color: white; }

/* ═══════════════════════════════════════════════════════
   CONTENT
═══════════════════════════════════════════════════════ */
.content {
  padding: 16px 16px 110px;
  max-width: 520px;
  margin: 0 auto;
}

/* ═══════════════════════════════════════════════════════
   SECTION
═══════════════════════════════════════════════════════ */
.section {
  margin-bottom: 32px;
  opacity: 0;
  transform: translateY(16px);
  animation: fadeUp 0.4s ease forwards;
}
.section:nth-child(1)  { animation-delay: 0.04s; }
.section:nth-child(2)  { animation-delay: 0.08s; }
.section:nth-child(3)  { animation-delay: 0.12s; }
.section:nth-child(4)  { animation-delay: 0.16s; }
.section:nth-child(5)  { animation-delay: 0.20s; }
.section:nth-child(6)  { animation-delay: 0.24s; }
.section:nth-child(7)  { animation-delay: 0.28s; }
.section:nth-child(8)  { animation-delay: 0.32s; }
.section:nth-child(9)  { animation-delay: 0.36s; }
.section:nth-child(10) { animation-delay: 0.40s; }
.section:nth-child(11) { animation-delay: 0.44s; }
.section:nth-child(12) { animation-delay: 0.48s; }
.section.hidden { display: none; }

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

.section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 10px;
  padding-left: 2px;
}
.section-title {
  font-family: var(--font-display);
  font-size: 22px;
  letter-spacing: -0.3px;
}
.section-count {
  font-size: 12px;
  color: var(--text-3);
  font-weight: 500;
}

/* ═══════════════════════════════════════════════════════
   CARDS
═══════════════════════════════════════════════════════ */
.card {
  background: var(--surface);
  border-radius: var(--r);
  margin-bottom: 8px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px;
  cursor: pointer;
  transition: transform 0.18s, box-shadow 0.18s;
  border: 1px solid var(--border);
  overflow: hidden;
  position: relative;
}
.card:active { transform: scale(0.976); box-shadow: none; }

.card-img {
  width: 80px; height: 80px;
  border-radius: var(--r-sm);
  object-fit: cover;
  flex-shrink: 0;
  background: var(--bg);
}

/* Placeholder image area — backend replaces with real img src */
.card-img-placeholder {
  width: 80px; height: 80px;
  border-radius: var(--r-sm);
  background: linear-gradient(135deg, #EDECEA 0%, #DDDBD7 100%);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  position: relative;
  overflow: hidden;
}
.card-img-placeholder::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 60%);
}

.card-body { flex: 1; min-width: 0; }
.card-name {
  font-size: 15px; font-weight: 600;
  letter-spacing: -0.2px;
  margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card-desc { font-size: 13px; color: var(--text-2); margin-bottom: 6px; line-height: 1.3; }
.card-price { font-size: 15px; font-weight: 700; color: var(--text); }
.card-price-unavail { font-size: 12px; color: var(--text-3); font-weight: 500; }

.card-add {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  font-size: 20px; font-weight: 300;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: transform 0.15s, background 0.15s;
  line-height: 1;
  border: none;
  cursor: pointer;
}
.card:active .card-add { transform: scale(0.85); background: var(--accent-hover); }

/* Unavailable state */
.card.unavailable { opacity: 0.45; }
.card.unavailable .card-add { background: var(--border-med); }

/* ═══════════════════════════════════════════════════════
   BOTTOM CART BAR
═══════════════════════════════════════════════════════ */
.cart-bar {
  position: fixed;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  left: 50%; transform: translateX(-50%) translateY(90px);
  width: calc(100% - 32px);
  max-width: 480px;
  background: var(--text);
  color: white;
  border-radius: var(--r);
  padding: 0 16px;
  height: 56px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer;
  box-shadow: var(--shadow-lg);
  transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
  z-index: 200;
  opacity: 0;
  border: none;
}
.cart-bar.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
.cart-bar:active { transform: translateX(-50%) scale(0.97) !important; }

.cart-bar-badge {
  background: var(--accent);
  border-radius: 8px;
  padding: 4px 9px;
  font-size: 13px; font-weight: 700;
  min-width: 28px; text-align: center;
}
.cart-bar-label { font-size: 15px; font-weight: 600; letter-spacing: -0.2px; }
.cart-bar-total { font-size: 15px; font-weight: 700; }

@keyframes cartBounce {
  0%   { transform: translateX(-50%) translateY(0) scale(1); }
  40%  { transform: translateX(-50%) translateY(-8px) scale(1.03); }
  70%  { transform: translateX(-50%) translateY(2px) scale(0.98); }
  100% { transform: translateX(-50%) translateY(0) scale(1); }
}
.cart-bar.bounce { animation: cartBounce 0.38s ease; }

/* ═══════════════════════════════════════════════════════
   MODAL
═══════════════════════════════════════════════════════ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0);
  z-index: 300;
  display: none;
  transition: background 0.3s;
}
.modal-overlay.open { background: rgba(0,0,0,0.45); }

.modal-sheet {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  padding-bottom: env(safe-area-inset-bottom, 20px);
  max-height: 92vh;
  overflow-y: auto;
  overflow-x: hidden;
  transform: translateY(100%);
  transition: transform 0.38s cubic-bezier(0.32,0.72,0,1);
}
.modal-sheet.open { transform: translateY(0); }

.modal-handle {
  width: 38px; height: 4px;
  background: #DDDBD7;
  border-radius: 3px;
  margin: 10px auto 0;
}

.modal-body { padding: 16px 20px 24px; }

/* Item modal image */
.item-modal-img {
  width: 100%; height: 220px;
  object-fit: cover;
  border-radius: var(--r);
  margin-bottom: 16px;
  background: var(--bg);
  display: block;
}
.item-modal-img-placeholder {
  width: 100%; height: 180px;
  background: linear-gradient(135deg, #EDECEA, #DDDBD7);
  border-radius: var(--r);
  margin-bottom: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 64px;
}

.item-modal-name {
  font-family: var(--font-display);
  font-size: 24px; letter-spacing: -0.4px;
  margin-bottom: 4px;
}
.item-modal-desc {
  font-size: 15px; color: var(--text-2);
  margin-bottom: 16px; line-height: 1.5;
}
.item-modal-meta {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-bottom: 16px;
}
.item-modal-tag {
  font-size: 12px; font-weight: 600;
  background: var(--bg); color: var(--text-2);
  padding: 3px 9px; border-radius: 20px;
}

.divider { height: 1px; background: var(--border); margin: 4px 0 16px; }

.qty-row {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.qty-label { font-size: 15px; font-weight: 500; }
.qty-controls {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg); border-radius: 12px; padding: 4px;
}
.qty-btn {
  min-width: 38px; height: 34px;
  border-radius: 9px; background: white;
  border: none; font-size: 18px; font-weight: 400;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s; color: var(--text);
  padding: 0 10px;
}
.qty-btn:active { transform: scale(0.9); }
.qty-num { font-size: 16px; font-weight: 700; min-width: 24px; text-align: center; }

/* Buttons */
.btn-primary {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; background: var(--accent); color: white;
  border: none; border-radius: var(--r);
  padding: 0 18px; height: 54px;
  font-size: 16px; font-weight: 600;
  font-family: var(--font-body); cursor: pointer;
  transition: transform 0.15s, opacity 0.15s;
  letter-spacing: -0.2px;
}
.btn-primary:active { transform: scale(0.97); opacity: 0.88; }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-secondary {
  display: block; width: 100%;
  background: var(--bg); color: var(--text);
  border: none; border-radius: var(--r);
  padding: 0 18px; height: 48px;
  font-size: 15px; font-weight: 500;
  font-family: var(--font-body); cursor: pointer;
  margin-top: 8px;
  transition: opacity 0.15s;
}
.btn-secondary:active { opacity: 0.6; }

/* Modal title */
.modal-title {
  font-family: var(--font-display);
  font-size: 22px; letter-spacing: -0.4px;
  margin-bottom: 4px;
}
.modal-subtitle { font-size: 14px; color: var(--text-2); margin-bottom: 16px; }

/* Cart items */
.cart-item-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.cart-item-img {
  width: 52px; height: 52px;
  border-radius: var(--r-sm); object-fit: cover;
  background: var(--bg); flex-shrink: 0;
}
.cart-item-img-placeholder {
  width: 52px; height: 52px;
  border-radius: var(--r-sm);
  background: var(--bg); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
.cart-item-price { font-size: 13px; color: var(--text-2); }
.cart-item-controls {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border-radius: 10px; padding: 3px;
}
.cart-ctrl-btn {
  width: 28px; height: 28px;
  border-radius: 7px; background: white;
  border: none; font-size: 16px;
  font-family: var(--font-body); cursor: pointer;
  box-shadow: var(--shadow-sm);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.1s; color: var(--text);
}
.cart-ctrl-btn:active { transform: scale(0.85); }
.cart-ctrl-num { font-size: 14px; font-weight: 700; min-width: 18px; text-align: center; }

.total-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 0 4px;
}
.total-label { font-size: 15px; font-weight: 500; color: var(--text-2); }
.total-amount { font-size: 24px; font-weight: 700; letter-spacing: -0.6px; }

/* Payment */
.pay-options {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; margin-bottom: 16px;
}
.pay-btn {
  height: 60px; border: none; border-radius: var(--r);
  background: var(--bg); font-family: var(--font-body);
  font-size: 14px; font-weight: 600; cursor: pointer;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  transition: transform 0.15s, background 0.15s; color: var(--text);
  border: 1px solid var(--border);
}
.pay-btn:active { transform: scale(0.95); }
.pay-btn .pay-icon { font-size: 20px; }
.pay-btn.apple  { background: #1C1C1E; color: white; border-color: transparent; }
.pay-btn.google { background: white; }

/* Input fields */
.input-field {
  width: 100%; padding: 0 14px; height: 50px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--r-sm); font-size: 15px;
  font-family: var(--font-body); color: var(--text);
  margin-bottom: 10px; outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.input-field:focus {
  border-color: rgba(200,65,10,0.4);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.input-field::placeholder { color: var(--text-3); }

/* Checkboxes for payment consent */
.consent-block { margin: 4px 0 14px; }
.consent-row {
  display: flex; align-items: flex-start; gap: 10px;
  margin-bottom: 10px;
}
.consent-row input[type="checkbox"] {
  width: 18px; height: 18px;
  accent-color: var(--accent);
  margin-top: 2px; flex-shrink: 0; cursor: pointer;
}
.consent-label {
  font-size: 13px; line-height: 1.4; color: var(--text-2);
}
.consent-label a {
  color: var(--accent); text-decoration: underline; cursor: pointer;
}
.consent-required { font-size: 11px; color: var(--text-3); }

/* Success */
.success-icon {
  width: 72px; height: 72px;
  background: #27AE60; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; margin: 20px auto 16px;
}
.success-title {
  text-align: center;
  font-family: var(--font-display);
  font-size: 24px; letter-spacing: -0.5px; margin-bottom: 6px;
}
.success-sub { text-align: center; color: var(--text-2); font-size: 15px; margin-bottom: 24px; }
.success-table { text-align: center; font-size: 13px; color: var(--text-3); margin-bottom: 20px; }

/* Empty cart */
.empty-cart {
  text-align: center; padding: 30px 0 10px;
  color: var(--text-2); font-size: 15px;
}
.empty-cart .icon { font-size: 48px; margin-bottom: 10px; }

/* Privacy modal content */
.privacy-content { font-size: 14px; color: var(--text-2); line-height: 1.6; }
.privacy-content h3 {
  font-family: var(--font-display);
  font-size: 18px; color: var(--text);
  margin: 16px 0 6px;
}
.privacy-content p { margin-bottom: 10px; }
</style>
</head>

<body>

<!-- ═══════════════════════════════════════════════════
     COOKIE CONSENT BANNER
═══════════════════════════════════════════════════ -->
<div id="cookieBanner">

/* ═══════════════════════════════════════════════════════
   EMOJI MAP (by category id)
═══════════════════════════════════════════════════════ */
const EMOJI = Object.fromEntries(
  Object.entries(MENU_DATA).map(([k, v]) => [k, v.emoji])
);

/* helper: get category id of an item */
function getCatIdOf(item) {
  return Object.keys(MENU_DATA).find(k => MENU_DATA[k].items.includes(item));
}

/* helper: localised name of item */
function itemName(item) {
  if (lang === 'ru' && item.nameRu) return item.nameRu;
  if (lang === 'en' && item.nameEn) return item.nameEn;
  return item.nameLv;
}

/* helper: localised description */
function itemDesc(item) {
  if (lang === 'ru' && item.descRu) return item.descRu;
  if (lang === 'en' && item.descEn) return item.descEn;
  return item.descLv || '';
}

/* helper: localised category name */
function catName(catId) {
  const c = MENU_DATA[catId];
  if (!c) return catId;
  if (lang === 'ru') return c.nameRu;
  if (lang === 'en') return c.nameEn;
  return c.nameLv;
}

/* ═══════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════ */
let cart = [];          // [{ item, qty }]
let currentItem = null;
let currentQty  = 1;
let modalMode   = null; // 'item' | 'cart' | 'payment' | 'privacy'

/* ═══════════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════════ */
function render() {
  const content = document.getElementById('content');
  const pills   = document.getElementById('catPills');

  // Table number
  document.getElementById('tableNum').textContent = TABLE_NUMBER;

  Object.keys(MENU_DATA).forEach((catId, ci) => {
    const cat = MENU_DATA[catId];

    // Category pill
    const pill = document.createElement('button');
    pill.className = 'cat-pill' + (ci === 0 ? ' active' : '');
    pill.textContent = cat.emoji + ' ' + catName(catId);
    pill.dataset.cat = catId;
    pill.onclick = () => scrollToSection(catId, pill);
    pills.appendChild(pill);

    // Section
    const sec = document.createElement('section');
    sec.className = 'section';
    sec.id = 'sec-' + catId;
    sec.dataset.category = catId;

    const hdr = document.createElement('div');
    hdr.className = 'section-header';
    hdr.innerHTML = `
      <h2 class="section-title">${cat.emoji} ${catName(catId)}</h2>
      <span class="section-count">${cat.items.length} / ${cat.maxItems}</span>
    `;
    sec.appendChild(hdr);

    if (cat.items.length === 0) {
      // Show placeholder slots up to maxItems
      const placeholderCount = Math.min(cat.maxItems, 3); // show up to 3 skeleton placeholders
      for (let i = 0; i < placeholderCount; i++) {
        sec.appendChild(makePlaceholderCard(catId, i + 1));
      }
    } else {
      cat.items.forEach(item => sec.appendChild(makeCard(item, catId)));
    }

    content.appendChild(sec);
  });

  window.addEventListener('scroll', updateActivePill, { passive: true });
}

/* Real item card */
function makeCard(item, catId) {
  const card = document.createElement('div');
  card.className = 'card' + (item.available === false ? ' unavailable' : '');
  /* data-item-id for backend hooking */
  card.dataset.itemId = item.id;
  card.dataset.category = catId;

  const emoji = EMOJI[catId] || '🍽';
  const imgHtml = item.img
    ? `<img class="card-img" src="${item.img}" alt="${item.nameLv}" loading="lazy"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';
  const placeholder = `<div class="card-img-placeholder" style="${item.img ? 'display:none' : ''}">${emoji}</div>`;

  const addBtn = item.available !== false
    ? `<button class="card-add" aria-label="Pievienot">+</button>`
    : `<button class="card-add" style="background:var(--border-med)" disabled>−</button>`;

  card.innerHTML = `
    ${imgHtml}${placeholder}
    <div class="card-body">
      <div class="card-name">${itemName(item)}</div>
      <div class="card-desc">${itemDesc(item)}</div>
      <div class="card-price">${item.price ? item.price.toFixed(2) + ' €' : ''}</div>
    </div>
    ${addBtn}
  `;

  if (item.available !== false) {
    card.onclick = () => openItemModal(item, catId);
  }

  return card;
}

/* Placeholder card — shown until CMS content is loaded */
function makePlaceholderCard(catId, index) {
  const card = document.createElement('div');
  card.className = 'card';
  card.style.opacity = '0.4';
  card.style.pointerEvents = 'none';
  /* data-placeholder for backend: replace with real item cards */
  card.dataset.placeholder = `${catId}-${index}`;

  const emoji = EMOJI[catId] || '🍽';

  card.innerHTML = `
    <div class="card-img-placeholder">${emoji}</div>
    <div class="card-body">
      <div class="card-name" style="background:#DDDBD7;color:transparent;border-radius:6px;width:70%">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</div>
      <div class="card-desc" style="background:#E8E6E2;color:transparent;border-radius:5px;width:50%;margin-top:6px">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</div>
      <div class="card-price" style="background:#E8E6E2;color:transparent;border-radius:5px;width:30%;margin-top:8px">&nbsp;&nbsp;&nbsp;</div>
    </div>
    <div class="card-add" style="background:var(--border-med)">+</div>
  `;
  return card;
}

/* ═══════════════════════════════════════════════════════
   SCROLL SPY
═══════════════════════════════════════════════════════ */
function scrollToSection(catId, pill) {
  const sec = document.getElementById('sec-' + catId);
  if (!sec) return;
  const top = sec.getBoundingClientRect().top + window.scrollY - 110;
  window.scrollTo({ top, behavior: 'smooth' });
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  pill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

function updateActivePill() {
  const sections = Object.keys(MENU_DATA).map(cat => ({
    cat, el: document.getElementById('sec-' + cat)
  })).filter(s => s.el);

  let active = sections[0]?.cat;
  for (const { cat, el } of sections) {
    if (el.getBoundingClientRect().top <= 120) active = cat;
  }

  document.querySelectorAll('.cat-pill').forEach(p => {
    const isActive = p.dataset.cat === active;
    p.classList.toggle('active', isActive);
    if (isActive) p.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  });
}

/* ═══════════════════════════════════════════════════════
   ITEM MODAL
═══════════════════════════════════════════════════════ */
function openItemModal(item, catId) {
  currentItem = item;
  currentQty  = 1;
  modalMode   = 'item';

  const body  = document.getElementById('modalBody');
  const emoji = EMOJI[catId] || '🍽';

  const imgHtml = item.img
    ? `<img class="item-modal-img" src="${item.img}" alt="${item.nameLv}"
         onerror="this.outerHTML='<div class=\\'item-modal-img-placeholder\\'>${emoji}</div>'">`
    : `<div class="item-modal-img-placeholder">${emoji}</div>`;

  body.innerHTML = `
    ${imgHtml}
    <div class="item-modal-name">${itemName(item)}</div>
    <div class="item-modal-desc">${itemDesc(item)}</div>
    <div class="divider"></div>
    <div class="qty-row">
      <span class="qty-label">${t('quantity')}</span>
      <div class="qty-controls">
        <button class="qty-btn" onclick="changeQty(-1)">−</button>
        <span class="qty-num" id="qtyNum">1</span>
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>
    </div>
    <button class="btn-primary" id="addBtn" onclick="addToCart()">
      <span>${t('addToCart')}</span>
      <span id="addBtnPrice">${item.price.toFixed(2)} €</span>
    </button>
    <button class="btn-secondary" onclick="closeModal()">${t('close')}</button>
  `;

  openModal();
}

function changeQty(delta) {
  currentQty = Math.max(1, currentQty + delta);
  document.getElementById('qtyNum').textContent = currentQty;
  document.getElementById('addBtnPrice').textContent =
    (currentItem.price * currentQty).toFixed(2) + ' €';
}

function addToCart() {
  const existing = cart.find(c => c.item === currentItem);
  if (existing) {
    existing.qty += currentQty;
  } else {
    cart.push({ item: currentItem, qty: currentQty });
  }
  updateCartUI();
  closeModal();
}

/* ═══════════════════════════════════════════════════════
   CART MODAL
═══════════════════════════════════════════════════════ */
function openCartModal() {
  modalMode = 'cart';
  renderCartModal();
  openModal();
}

function renderCartModal() {
  const body = document.getElementById('modalBody');

  if (cart.length === 0) {
    body.innerHTML = `
      <div class="modal-title">${t('cartTitle')}</div>
      <div class="empty-cart">
        <div class="icon">🛒</div>
        ${t('cartEmpty')}
      </div>
      <button class="btn-secondary" onclick="closeModal()">${t('close')}</button>
    `;
    return;
  }

  const total = calcTotal();
  let itemsHtml = '';

  cart.forEach((entry, idx) => {
    const catId  = getCatIdOf(entry.item) || 'grils';
    const emoji  = EMOJI[catId] || '🍽';
    const imgHtml = entry.item.img
      ? `<img class="cart-item-img" src="${entry.item.img}" alt="${entry.item.nameLv}"
           onerror="this.outerHTML='<div class=\\'cart-item-img-placeholder\\'>${emoji}</div>'">`
      : `<div class="cart-item-img-placeholder">${emoji}</div>`;

    itemsHtml += `
      <div class="cart-item-row" id="ci-${idx}">
        ${imgHtml}
        <div class="cart-item-info">
          <div class="cart-item-name">${itemName(entry.item)}</div>
          <div class="cart-item-price">${entry.item.price.toFixed(2)} €</div>
        </div>
        <div class="cart-item-controls">
          <button class="cart-ctrl-btn" onclick="cartChange(${idx}, -1)">−</button>
          <span class="cart-ctrl-num" id="cqty-${idx}">${entry.qty}</span>
          <button class="cart-ctrl-btn" onclick="cartChange(${idx}, 1)">+</button>
        </div>
      </div>
    `;
  });

  body.innerHTML = `
    <div class="modal-title">${t('cartTitle')}</div>
    <div id="cart-items-list">${itemsHtml}</div>
    <div class="total-row">
      <span class="total-label">${t('total')}</span>
      <span class="total-amount" id="cartTotal">${total.toFixed(2)} €</span>
    </div>
    <button class="btn-primary" onclick="openPayment()">
      <span>${t('toPayment')}</span>
      <span>${total.toFixed(2)} €</span>
    </button>
    <button class="btn-secondary" onclick="closeModal()">${t('continueShopping')}</button>
  `;
}

function cartChange(idx, delta) {
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) {
    cart.splice(idx, 1);
    updateCartUI();
    renderCartModal();
    return;
  }
  const qtyEl = document.getElementById('cqty-' + idx);
  if (qtyEl) qtyEl.textContent = cart[idx].qty;
  updateCartUI();
  const totalEl = document.getElementById('cartTotal');
  if (totalEl) totalEl.textContent = calcTotal().toFixed(2) + ' €';
}

/* ═══════════════════════════════════════════════════════
   PAYMENT MODAL
   ───────────────────────────────────────────────────
   BACKEND INTEGRATION:
   • On "Confirm", POST to /api/order with:
       { tableNumber, items: [{id, nameLv, qty, price}], total, email, marketingConsent }
   • Kitchen receives Latvian item names (nameLv) only.
   • Stripe Checkout / Payment Intent URL injected by backend into pay buttons.
═══════════════════════════════════════════════════════ */
function openPayment() {

  const total = calcTotal();

  body.innerHTML = `
    <div class="modal-title">${t('paymentTitle')}</div>
    <div class="modal-subtitle">${t('total')}: ${total.toFixed(2)} €</div>

      </button>

      <button class="pay-btn" onclick="submitOrder('card')" style="grid-column:span 2">

    <div class="consent-block">
      <div class="consent-row">
        <!-- BACKEND: email_consent=true is required to send invoice -->
        <input type="checkbox" id="consentEmail" required>
        <label class="consent-label" for="consentEmail">
          ${t('consentEmail')} <span class="consent-required">${t('required')}</span>
        </label>
      </div>
      <div class="consent-row">
        <!-- BACKEND: marketing_consent stored in customer profile -->
        <input type="checkbox" id="consentMarketing">
        <label class="consent-label" for="consentMarketing">
          ${t('consentMarketing')}
        </label>
      </div>
    </div>

    <button class="btn-primary" id="confirmBtn" onclick="submitOrder('confirm')">
      <span>${t('confirmOrder')}</span>
      <span>${total.toFixed(2)} €</span>
    </button>
    <button class="btn-secondary" onclick="openCartModal()">${t('back')}</button>
  `;
}

/* ═══════════════════════════════════════════════════════
   ORDER SUBMISSION
   ───────────────────────────────────────────────────
   BACKEND: Replace this function body with actual API call.
   Build the order payload as shown below and POST to /api/order.
═══════════════════════════════════════════════════════ */
function submitOrder(method) {
  const emailField = document.getElementById('emailField');
  const consentEmail = document.getElementById('consentEmail');

  if (!consentEmail?.checked) {
    consentEmail?.parentElement?.parentElement?.classList?.add('shake');
    return;
  }

  /* ── ORDER PAYLOAD (always Latvian item names for kitchen) ── */
  const orderPayload = {
    tableNumber: TABLE_NUMBER,
    paymentMethod: method,
    email: emailField?.value || '',
    emailConsent: consentEmail?.checked || false,
    marketingConsent: document.getElementById('consentMarketing')?.checked || false,
    /* Kitchen-facing: always Latvian */
    items: cart.map(c => ({
      id:     c.item.id,
      nameLv: c.item.nameLv,   // ← sent to kitchen
      qty:    c.qty,
      price:  c.item.price
    })),
    total: calcTotal(),
    currency: 'EUR',
    timestamp: new Date().toISOString()
  };

  console.log('[Grill In] Order payload:', orderPayload);
  /*
    BACKEND TODO:
    const res = await fetch('/api/order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(orderPayload)
    });
    const data = await res.json();
    if (data.stripeUrl) window.location.href = data.stripeUrl;
    else showSuccess();
  */

  showSuccess();
}

function showSuccess() {
  const body = document.getElementById('modalBody');
  body.innerHTML = `
    <div class="success-icon">✓</div>
    <div class="success-title">${t('successTitle')}</div>
    <div class="success-sub">${t('successSub')}</div>
    <div class="success-table">${t('successTable')} <strong>#${TABLE_NUMBER}</strong></div>
    <button class="btn-primary" onclick="resetOrder()" style="justify-content:center;margin-top:8px">${t('newOrder')}</button>
  `;
}

function resetOrder() {
  cart = [];
  updateCartUI();
  closeModal();
}

/* ═══════════════════════════════════════════════════════
   MODAL HELPERS
═══════════════════════════════════════════════════════ */
function openModal() {
  const overlay = document.getElementById('modalOverlay');
  const sheet   = document.getElementById('modalSheet');
  overlay.style.display = 'block';
  requestAnimationFrame(() => {
    overlay.classList.add('open');
    sheet.classList.add('open');
  });
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  const overlay = document.getElementById('modalOverlay');
  const sheet   = document.getElementById('modalSheet');
  overlay.classList.remove('open');
  sheet.classList.remove('open');
  setTimeout(() => {
    overlay.style.display = 'none';
    document.body.style.overflow = '';
  }, 400);
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

/* ═══════════════════════════════════════════════════════
   CART UI
═══════════════════════════════════════════════════════ */
function calcTotal()  { return cart.reduce((s, c) => s + c.item.price * c.qty, 0); }
function calcCount()  { return cart.reduce((s, c) => s + c.qty, 0); }

function updateCartUI() {
  const count  = calcCount();
  const total  = calcTotal();
  const bar    = document.getElementById('cartBar');
  const hCart  = document.getElementById('headerCart');

  document.getElementById('cartBarCount').textContent   = count;
  document.getElementById('cartBarTotal').textContent   = total.toFixed(2) + ' €';
  document.getElementById('headerCartCount').textContent = count;

  if (count > 0) {
    bar.classList.add('visible');
    hCart.style.display = 'flex';
    bar.classList.remove('bounce');
    void bar.offsetWidth;
    bar.classList.add('bounce');
  } else {
    bar.classList.remove('visible');
    hCart.style.display = 'none';
  }
}

/* ═══════════════════════════════════════════════════════
   COOKIE CONSENT
═══════════════════════════════════════════════════════ */
function acceptAll() {
  localStorage.setItem('consent', JSON.stringify({ necessary: true, marketing: true }));
  hideCookieBanner();
}

function acceptSelected() {
  const marketing = document.getElementById('ckMarketing')?.checked || false;
  localStorage.setItem('consent', JSON.stringify({ necessary: true, marketing }));
  hideCookieBanner();
}

function hideCookieBanner() {
  document.getElementById('cookieBanner').classList.add('hidden');
}

function checkConsent() {
  const stored = localStorage.getItem('consent');
  if (stored) hideCookieBanner();
}
